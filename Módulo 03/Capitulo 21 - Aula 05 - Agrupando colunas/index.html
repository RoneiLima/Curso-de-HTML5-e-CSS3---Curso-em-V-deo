<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrupando Colunas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            width: 600px;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border: 1px solid black;
            text-align: center;
        }

        col.cNome {
            background-color: lightgreen;
        }
        col.cGrupo {
            background-color: pink;
        }
    </style>
</head>
<body>
    <table>
        <colgroup>
            <col class="cNome">
            <col class="cGrupo" span="2"> <!-- São 4 colunas porém esse span 2 faz a coluna ocupar duas -->
            <col class="cProf">
        </colgroup>
