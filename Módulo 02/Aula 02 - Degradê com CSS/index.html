<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        * {
            /* Configurações globais das CSS */
            height: 100%;
        }
        body {
            /* em to right aceita valores em graus 90deg, 45deg, e pode por quantas cores quiser */
            /* Linear gradiente também pode ser um radial gradiente, primeiro valor recebe circle */
            /* Também se pode colocar uma porcentagem depois de cara cor, indicando o quanto dela vai ter no gradiente */
            background-image: linear-gradient(to top, #960CF2, #FC01D8, #FE017F, #F25D07, #F29F05);
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>Testando gradiente</h1>
</body>
</html>
