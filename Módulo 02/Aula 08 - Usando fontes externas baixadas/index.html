<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usando fontes externas baixadas</title>
    <style>
        @font-face {
            font-family: 'Love';
            src: url('fonts/love larry.ttf') format('truetype'); /* aqui você pode adicionar mais de uma fonte caso tenha o otf e o ttf é só por uma vírgula e adicionar outra url e format */
            /*
                Tipos de format ()
                - opentype (otf)
                - truetype (ttf)
                - embedded-opentype 
                - truetype-aat (Apple Advanced Typography)
                - svg
            */
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            font-family: 'Love', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Teste de fonte</h1>
    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Laboriosam corrupti earum natus, magnam laudantium ipsum vero. Quasi dolore, cum laborum quaerat quod iste doloremque nemo sed nihil molestias ex cupiditate?</p>
</body>
</html>
